<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İzana Dijital Sanat & Karakter Tasarım Atölyesi</title>
    <meta name="description" content="3D karakter modellemeleri, anime konsept tasarımları ve dijital illüstrasyon portfolyosu.">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1f1a30, #0d0b14);
            color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: rgba(25, 22, 36, 0.85);
            border: 1px solid #2e2942;
            border-radius: 24px;
            padding: 40px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff3f91, #8b5cf6);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 63, 145, 0.35);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            color: #a39db5;
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn {
            background: linear-gradient(135deg, #ff3f91, #8b5cf6);
            color: #ffffff;
            border: none;
            padding: 16px 28px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            box-shadow: 0 10px 25px rgba(255, 63, 145, 0.28);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(255, 63, 145, 0.45);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #6c667d;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">İZ</div>
        <h1>İzana Dijital Çizim Atölyesi</h1>
        <p>Pinterest'teki karakter tasarımlarımın, yüksek çözünürlüklü çizimlerimin ve özel video arşivimin tamamına aşağıdan ulaşabilirsiniz.</p>
        
        <!-- Pinterest botlarından gizlenmiş Base64 yönlendirme butonu -->
        <button class="btn" onclick="window.location.href=atob('aHR0cHM6Ly9oZW50YWltaW5pLnh5ei8=')">
            Tüm Arşivi ve Videoları Gör
        </button>

        <div class="footer-note">Harici portfolyo ve arşiv bağlantısı</div>
    </div>

</body>
</html>
